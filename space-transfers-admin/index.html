<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A signed-in tool, not a public site: search engines should not list it. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Tab icon. PNG rather than the source SVG on purpose: space.svg is a
         125 kB base64 PNG in an SVG wrapper, so it carries none of the
         scalability an SVG favicon is chosen for while costing ~70× the bytes
         of the 32px raster. 512px covers install prompts; apple-touch-icon is
         what iOS uses for a home-screen shortcut.
         Byte-identical to the store and printer apps — one brand, one icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Transfers — Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
